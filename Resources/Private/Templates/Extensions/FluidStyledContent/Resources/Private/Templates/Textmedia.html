<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div id="c{data.uid}">
    <div class="content">
        <f:render partial="Header" arguments="{_all}"/>
        <f:if condition="{data.imageorient} == 100">
            <f:render partial="MediaGallerySingle" arguments="{_all}"/>
        </f:if>
        <f:if condition="{data.imageorient} == 110">
            <f:render partial="MediaGalleryMultiple" arguments="{_all}"/>
        </f:if>
        <f:if condition="{data.imageorient} == 120">
            <f:render partial="MediaGalleryFull" arguments="{_all}"/>
        </f:if>
        </div>
    <f:format.html>{data.bodytext}</f:format.html>
        <f:render partial="Footer" arguments="{_all}"/>
    </div>
</html>
